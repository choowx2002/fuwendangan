name: Build Arch Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional draft Release tag; leave empty to build artifacts only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: arch-build-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  linux:
    name: Build Linux binary for Arch packaging
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase configuration
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name as a GitHub Actions variable or secret."
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend and generate SvelteKit configuration
        run: pnpm check

      - name: Build Debian bundle for Arch packaging
        env:
          NO_STRIP: 'true'
        run: pnpm tauri build --ci --bundles deb -- --locked

      - name: Upload intermediate Debian bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          if-no-files-found: error
          path: src-tauri/target/release/bundle/deb/*.deb

  arch:
    name: Package Arch Linux x64
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel

    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed git python libarchive

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debian bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: linux-bundles

      - name: Prepare Arch package
        run: |
          mkdir -p arch-build
          cp .github/packaging/arch/PKGBUILD arch-build/PKGBUILD
          shopt -s nullglob
          debs=(linux-bundles/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one Linux .deb bundle.'
            exit 1
          fi
          cp "${debs[0]}" arch-build/app.deb
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          version = version.replace('-', '_').replace('+', '_')
          if not re.fullmatch(r'[A-Za-z0-9._]+', version):
              raise SystemExit('Invalid Arch package version')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RUNE_ARCHIVE_VERSION={version}\n')
          PY
          useradd --create-home builder
          chown -R builder:builder arch-build

      - name: Build pacman package
        run: |
          runuser -u builder -- bash -c \
            'cd "$1" && makepkg --nodeps --cleanbuild --noconfirm' \
            _ "$GITHUB_WORKSPACE/arch-build"

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-linux-x64
          if-no-files-found: error
          path: arch-build/*.pkg.tar.zst

  release:
    name: Upload Arch package to draft Release
    needs: arch
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Arch artifact
        uses: actions/download-artifact@v4
        with:
          name: arch-linux-x64
          path: release-assets

      - name: Create draft Release and upload Arch package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$RELEASE_COMMIT" \
              --title "Rune Archive $RELEASE_TAG" \
              --notes 'Arch Linux x64 package. Install the .pkg.tar.zst asset using pacman -U.'
          fi
          shopt -s nullglob
          assets=(release-assets/*.pkg.tar.zst)
          if [ "${#assets[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one Arch Linux package.'
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
